[package]
name = "tauri-bun-react-shadcn-ui-app"
version = "0.1.3"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
rust-version = "1.98.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_bun_react_shadcn_ui_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
# Denied by default. Native Windows modules may use `unsafe`
# (`snap_layout.rs` for Snap Layouts, `system_appearance.rs` for DWM theme).
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-opener = "=2.5.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
mimalloc = { git = "https://github.com/amsokol/mimalloc", tag = "v3.5.1", features = ["override"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
